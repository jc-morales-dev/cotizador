name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run build
        env:
          # El build solo necesita que las variables existan; las reales viven en Vercel.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: clave-de-ejemplo-para-el-build

  e2e:
    runs-on: ubuntu-latest
    needs: build

    # El e2e corre contra el Supabase de la demo de verdad: crea una cotización,
    # la responde y la borra. Dos corridas simultáneas se pelearían por el
    # correlativo (max(numero) + 1), así que van de a una.
    concurrency:
      group: e2e-demo
      cancel-in-progress: false

    # Los secrets no llegan a los PR desde forks, y sin credenciales el e2e no
    # puede hacer nada. En ese caso se saltea en vez de fallar en rojo.
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run e2e
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Guardar el reporte si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
